name: Validate reviewed release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check recorded content and relative resources without executing candidate code
        run: python3 -B tests/validate_release.py
